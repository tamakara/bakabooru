apiVersion: batch/v1
kind: Job

metadata:
  name: minio-createbuckets
  namespace: bakabooru

spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc
        envFrom:
        - secretRef:
            name: minio-secret
        command:
        - /bin/sh
        - -c
        - |
          mc alias set myminio \
          http://minio:9000 \
          $MINIO_ROOT_USER \
          $MINIO_ROOT_PASSWORD
          mc mb --ignore-existing \
          myminio/images
          mc anonymous set public \
          myminio/images