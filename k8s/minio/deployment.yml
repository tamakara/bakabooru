apiVersion: apps/v1
kind: Deployment

metadata:
  name: minio
  namespace: bakabooru

spec:
  replicas: 1

  selector:
    matchLabels:
      app: minio

  template:
    metadata:
      labels:
        app: minio

    spec:
      containers:
      - name: minio
        image: minio/minio

        args:
        - server
        - /data
        - --console-address
        - ":9001"

        ports:
        - containerPort: 9000
        - containerPort: 9001

        envFrom:
        - secretRef:
            name: minio

        volumeMounts:
        - name: minio-data
          mountPath: /data

      volumes:
      - name: minio-data
        persistentVolumeClaim:
          claimName: minio-pvc