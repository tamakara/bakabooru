[project]
name = "bakabooru-ai-service"
version = "0.1.0"
description = "Stateless image analysis and embedding service for BaKaBooru"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "huggingface-hub",
    "minio",
    "numpy",
    "onnxruntime-gpu",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "prometheus-client>=0.26,<1",
    "python-multipart",
    "transformers",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
