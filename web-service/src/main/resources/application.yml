spring:
  application:
    name: bakabooru

  # 数据库配置
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:bakabooru}
    username: ${DB_USER}
    password: ${DB_PASS}

  # JPA / Hibernate 配置
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Flyway 数据库迁移
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  task:
    scheduling:
      pool:
        size: 4

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always

# MinIO 配置
minio:
  endpoint: http://${MINIO_HOST:minio}:${MINIO_PORT:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:images}

# 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

# 应用自定义配置
app:
  upload:
    poll-interval-ms: ${UPLOAD_POLL_INTERVAL_MS:1000}
    initial-delay-ms: ${UPLOAD_INITIAL_DELAY_MS:2000}
    heartbeat-interval-ms: ${UPLOAD_HEARTBEAT_INTERVAL_MS:30000}
    lock-duration: ${UPLOAD_LOCK_DURATION:PT2M}
  # AI 服务配置
  ai-service:
    url: ${AI_SERVICE_URL:http://ai-service:8000}
  ai-job:
    poll-interval-ms: ${AI_JOB_POLL_INTERVAL_MS:1000}
    initial-delay-ms: ${AI_JOB_INITIAL_DELAY_MS:2000}
    heartbeat-interval-ms: ${AI_JOB_HEARTBEAT_INTERVAL_MS:30000}
    lock-duration: ${AI_JOB_LOCK_DURATION:PT5M}
  thumbnail:
    max-size: 1024
    quality: 0.85
    format: jpg
