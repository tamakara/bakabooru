name: Build Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/bakabooru-frontend:latest

    - name: Build backend image
      uses: docker/build-push-action@v6
      with:
        context: ./web-service
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/bakabooru-web:latest

    - name: Build ai image
      uses: docker/build-push-action@v6
      with:
        context: ./ai-service
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/bakabooru-ai:latest
