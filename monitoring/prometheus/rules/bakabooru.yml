groups:
  - name: bakabooru-availability
    rules:
      - alert: BaKaBooruTargetDown
        expr: up{job!="prometheus"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} 无法采集"
      - alert: BaKaBooruHttpHighErrorRate
        expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum by (service) (rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} HTTP 5xx 超过 5%"
      - alert: BaKaBooruAiHttpHighErrorRate
        expr: sum(rate(bakabooru_ai_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(bakabooru_ai_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "AI Service HTTP 5xx 超过 5%"
  - name: bakabooru-business
    rules:
      - alert: BaKaBooruUploadQueueBacklog
        expr: bakabooru_upload_jobs{status="pending"} > 20
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "上传队列持续积压" }
      - alert: BaKaBooruAiQueueBacklog
        expr: bakabooru_ai_jobs{status="pending"} > 20
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "AI 队列持续积压" }
      - alert: BaKaBooruFailedJobs
        expr: bakabooru_upload_jobs{status="failed"} > 0 or bakabooru_ai_jobs{status="failed"} > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "存在失败的业务任务" }
  - name: bakabooru-infrastructure
    rules:
      - alert: PostgreSQLConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "PostgreSQL 连接使用率超过 80%" }
      - alert: PostgreSQLDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname="bakabooru"}[10m]) > 0
        labels: { severity: warning }
        annotations: { summary: "PostgreSQL 出现死锁" }
      - alert: PostgreSQLCacheHitLow
        expr: rate(pg_stat_database_blks_hit{datname="bakabooru"}[10m]) / clamp_min(rate(pg_stat_database_blks_hit{datname="bakabooru"}[10m]) + rate(pg_stat_database_blks_read{datname="bakabooru"}[10m]), 0.001) < 0.9
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "PostgreSQL 缓存命中率低于 90%" }
      - alert: MinIODriveSpaceLow
        expr: minio_cluster_capacity_usable_free_bytes / clamp_min(minio_cluster_capacity_usable_total_bytes, 1) < 0.15
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "MinIO 可用容量低于 15%" }
      - alert: MinIORequestErrors
        expr: sum(rate(minio_s3_requests_errors_total[5m])) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "MinIO 请求错误持续发生" }
