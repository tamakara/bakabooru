services:
  # ===================================================
  # 1. 基础设施：PostgreSQL (pgvector)
  # ===================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: bakabooru-db
    restart: always
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: bakabooru
    ports: ["5432:5432"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [bakabooru-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d bakabooru"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-monitoring-init:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: bakabooru
      PGUSER: db_user
      PGPASSWORD: db_password
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-prometheus_password}
    volumes:
      - ./monitoring/postgres/init-monitoring.sh:/usr/local/bin/init-monitoring.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-monitoring.sh"]
    networks: [bakabooru-net]
    depends_on:
      db:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: bakabooru-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://prometheus:${POSTGRES_EXPORTER_PASSWORD:-prometheus_password}@db:5432/bakabooru?sslmode=disable
    command: ["--extend.query-path=/etc/postgres_exporter/queries.yaml"]
    volumes:
      - ./monitoring/postgres/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    networks: [bakabooru-net]
    depends_on:
      postgres-monitoring-init:
        condition: service_completed_successfully

  # ===================================================
  # 2. 基础设施：MinIO
  # ===================================================
  minio:
    image: minio/minio
    container_name: bakabooru-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - ./data/minio:/data
    networks: [bakabooru-net]
    healthcheck:
      test:
        ["CMD-SHELL", "timeout 5s bash -c '</dev/tcp/localhost/9000' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks: [bakabooru-net]
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minio_user minio_password;
      /usr/bin/mc mb --ignore-existing myminio/images;
      /usr/bin/mc anonymous set public myminio/images;
      exit 0;
      "

  # ===================================================
  # 3. AI计算：AI Service (Python FastAPI)
  # ===================================================
  ai-service:
    build: ./ai-service
    container_name: bakabooru-ai-service
    restart: always
    gpus: all
    environment:
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio_user
      MINIO_SECRET_KEY: minio_password
      MINIO_BUCKET_NAME: images
      MODEL_CACHE_DIR: /model_cache
    volumes:
      - ./data/model_cache:/model_cache
    networks: [bakabooru-net]
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      minio:
        condition: service_healthy

  # ===================================================
  # 4. 核心业务：Web Service (Java Spring Boot)
  # ===================================================
  web-service:
    build: ./web-service
    container_name: bakabooru-web-service
    restart: always
    environment:
      # DB 配置
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: db_user
      DB_PASS: db_password
      DB_NAME: bakabooru
      # MinIO 配置
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio_user
      MINIO_SECRET_KEY: minio_password
      MINIO_BUCKET_NAME: images
      # AI 服务地址
      AI_SERVICE_URL: http://ai-service:8000
      # 缩略图配置
      THUMBNAIL_MAX_SIZE: 1024
      THUMBNAIL_QUALITY: 0.85
      THUMBNAIL_FORMAT: jpg
    networks: [bakabooru-net]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ===================================================
  # 5. 交互界面：Frontend (Nginx)
  # ===================================================
  frontend:
    build: ./frontend
    container_name: bakabooru-frontend
    restart: always
    ports: ["80:80"]
    networks: [bakabooru-net]
    depends_on:
      web-service:
        condition: service_healthy

  # ===================================================
  # 6. 监控：Prometheus
  # ===================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: bakabooru-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [bakabooru-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres-exporter:
        condition: service_started
      minio:
        condition: service_healthy

  loki:
    image: grafana/loki:3.5.3
    container_name: bakabooru-loki
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [bakabooru-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/busybox/wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: bakabooru-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [bakabooru-net]
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: bakabooru-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [bakabooru-net]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  bakabooru-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
