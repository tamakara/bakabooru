services:
  # ===================================================
  # 1. 基础设施：PostgreSQL (pgvector)
  # ===================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bakabooru-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bakabooru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-bakabooru}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [bakabooru-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===================================================
  # 2. 基础设施：MinIO
  # ===================================================
  minio:
    image: minio/minio
    container_name: bakabooru-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bakabooru}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - ./data/minio:/data
    networks: [bakabooru-net]
    healthcheck:
      test:
        ["CMD-SHELL", "timeout 5s bash -c '</dev/tcp/localhost/9000' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-createbuckets:
    image: minio/mc
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bakabooru}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    depends_on:
      minio:
        condition: service_healthy
    networks: [bakabooru-net]
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/images;
      /usr/bin/mc anonymous set public myminio/images;
      exit 0;
      "

  # ===================================================
  # 3. AI计算：AI Service (Python FastAPI)
  # ===================================================
  ai-service:
    build: ./ai-service
    container_name: bakabooru-ai-service
    restart: always
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-bakabooru}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      DEVICE: cuda
    gpus: all
    volumes:
      - ./data/model_cache:/model_cache
    networks: [bakabooru-net]
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      minio:
        condition: service_healthy

  # ===================================================
  # 4. 核心业务：Web Service (Java Spring Boot)
  # ===================================================
  web-service:
    build: ./web-service
    container_name: bakabooru-web-service
    restart: always
    environment:
      # DB 配置
      DB_USER: ${POSTGRES_USER:-bakabooru}
      DB_PASS: ${POSTGRES_PASSWORD:-change-me}
      DB_NAME: ${POSTGRES_DB:-bakabooru}
      # MinIO 配置
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-bakabooru}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
    networks: [bakabooru-net]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ===================================================
  # 5. 交互界面：Frontend (Nginx)
  # ===================================================
  frontend:
    build: ./frontend
    container_name: bakabooru-frontend
    restart: always
    ports: ["80:80"]
    networks: [bakabooru-net]
    depends_on:
      web-service:
        condition: service_healthy

networks:
  bakabooru-net:
    driver: bridge
