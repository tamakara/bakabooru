services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bakabooru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-bakabooru}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bakabooru}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - ./data/minio:/data
    healthcheck:
      test:
        ["CMD-SHELL", "timeout 5s bash -c '</dev/tcp/localhost/9000' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-createbuckets:
    image: minio/mc
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bakabooru}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/images;
      /usr/bin/mc anonymous set public myminio/images;
      "

  model-manager:
    build: ./model-manager
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-bakabooru}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
    gpus: all
    volumes:
      - ./data/model_cache:/model_cache
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      minio-createbuckets:
        condition: service_completed_successfully

  backend:
    build: ./backend
    environment:
      # DB 配置
      DB_USER: ${POSTGRES_USER:-bakabooru}
      DB_PASS: ${POSTGRES_PASSWORD:-change-me}
      DB_NAME: ${POSTGRES_DB:-bakabooru}
      # MinIO 配置
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-bakabooru}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio-createbuckets:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on:
      backend:
        condition: service_healthy
